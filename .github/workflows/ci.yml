name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Package VSIX
        run: npx --yes @vscode/vsce@4.1.1 package --githubBranch main

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: remove-console-log-vsix-${{ github.run_number }}
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 7
